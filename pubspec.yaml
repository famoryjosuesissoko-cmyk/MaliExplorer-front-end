name: mali_explorer_frontend
description: "Application mobile MaliExplorer - Frontend Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation & Gestion d'état
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Authentification & Services Cloud
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  supabase_flutter: ^2.5.0

  # Vues 360°, Vidéos & Médias
  webview_flutter: ^4.8.0
  video_player: ^2.8.6
  cached_network_image: ^3.3.1

  # UI, Polices & Utilitaires
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Déclaration des dossiers d'images et d'icônes
  assets:
    - assets/icons/
    - assets/images/